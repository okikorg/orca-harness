[package]
name = "orcacode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orca Code: interactive terminal host for Orca Harness. Streaming REPL, tool approvals, headless mode."

[[bin]]
name = "orcacode"
path = "src/main.rs"

[dependencies]
orca-harness-core = { path = "../harness-core" }
orca-harness-model-openai = { path = "../model-openai" }
orca-harness-model-openrouter = { path = "../model-openrouter" }
orca-harness-tools = { path = "../tools" }
orca-harness-tools-web = { path = "../tools-web" }
orca-harness-tools-mcp = { path = "../tools-mcp" }
orca-harness-tools-skills = { path = "../tools-skills" }
orca-harness-extensions = { path = "../extensions" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
futures-util = { workspace = true }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
textwrap = "0.16"
syntect-tui = { version = "3.0.6", default-features = false }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
