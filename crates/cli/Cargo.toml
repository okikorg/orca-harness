[package]
name = "orcacode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orca Code: interactive terminal host for Orca Harness. Streaming REPL, tool approvals, headless mode."

[[bin]]
name = "orcacode"
path = "src/main.rs"

[dependencies]
orca-harness-core = { path = "../harness-core" }
orca-harness-model-providers = { path = "../model-providers" }
orca-harness-provider-auth = { path = "../provider-auth" }
orca-harness-tools = { path = "../tools" }
orca-harness-tool-extensions = { path = "../tool-extensions" }
orca-harness-extensions = { path = "../extensions" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
futures-util = { workspace = true }
base64 = "0.22"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
textwrap = "0.16"
syntect-tui = { version = "3.0.6", default-features = false }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
