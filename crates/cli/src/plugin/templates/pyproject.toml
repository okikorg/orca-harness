[project]
name = "{{NAME}}"
version = "0.1.0"
description = "An Agent Plugin for Orcacode"
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE}}"]

[tool.pytest.ini_options]
pythonpath = ["src"]
