[package]
name = "orca-harness-tools-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP client for Orca Harness: connect stdio MCP servers and expose their tools to the agent. Deliberately outside the core tool set — spawning configured server processes is a host opt-in."

[lib]
name = "orca_harness_tools_mcp"

[dependencies]
orca-harness-core = { path = "../harness-core" }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
