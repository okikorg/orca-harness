[package]
name = "orca-harness-tools-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Skills for Orca Harness: discover SKILL.md folders on disk and expose them to the agent through one `skill` tool. Deliberately outside the core tool set — reading instructions from outside the workspace is a host opt-in."

[lib]
name = "orca_harness_tools_skills"

[dependencies]
orca-harness-core = { path = "../harness-core" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "skills"
harness = false
