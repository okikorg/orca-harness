[package]
name = "orca-harness-tool-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional MCP, skill, and web tool integrations for Orca Harness."

[lib]
name = "orca_harness_tool_extensions"

[dependencies]
orca-harness-core = { path = "../harness-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
reqwest.workspace = true
html-to-markdown-rs = { version = "3.11", default-features = false }

[dev-dependencies]
criterion.workspace = true
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "skills"
harness = false
