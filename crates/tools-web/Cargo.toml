[package]
name = "orca-harness-tools-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web tools for Orca Harness: fetch pages as markdown and search the web, behind an SSRF-guarded URL policy. Deliberately outside the core tool set — network egress is a host opt-in."

[lib]
name = "orca_harness_tools_web"

[dependencies]
orca-harness-core = { path = "../harness-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true }
html-to-markdown-rs = { version = "3.11", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
