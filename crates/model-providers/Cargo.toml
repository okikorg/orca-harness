[package]
name = "orca-harness-model-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Extensible model provider adapters for Orca Harness."

[lib]
name = "orca_harness_model_providers"

[dependencies]
httpdate = "1"
orca-harness-core = { path = "../harness-core" }
orca-harness-provider-auth = { path = "../provider-auth" }
async-trait.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["http2"] }
base64 = "0.22"
crc32fast = "1"
prost = "0.13"
prost-types = "0.13"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
