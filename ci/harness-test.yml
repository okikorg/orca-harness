name: harness-test

# Rust test/lint gate for the standalone orca-harness workspace. Scoped by
# path so it only runs when the harness changes; consumes zero untrusted
# input, same as the other workflows.

on:
  push:
    branches: [main]
    paths:
      - "orca-harness/**"
      - ".github/workflows/harness-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "orca-harness/**"
      - ".github/workflows/harness-test.yml"
  workflow_dispatch:

concurrency:
  group: harness-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-test:
    name: cargo test (orca-harness)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orca-harness
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orca-harness/target
          key: harness-${{ runner.os }}-${{ hashFiles('orca-harness/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: source size
        run: ./ci/check-source-size.sh

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: release binary size
        run: |
          cargo build --release -p orcacode
          ./ci/check-binary-size.sh

      - name: bench (smoke)
        run: cargo bench --workspace -- --test
