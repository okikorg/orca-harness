name: harness-bench

# Performance gate for the standalone orca-harness workspace: dispatch
# overhead and orcacode startup, both held to the budgets in
# benchmarks/check_budgets.py. Scoped by path like harness-test.yml and
# consumes zero untrusted input.
#
# Budgets are enforced on Linux, which is what this job runs on. They sit
# several times above the numbers a quiet machine produces — a shared
# runner cannot measure small drift honestly, so this catches cliffs.

on:
  push:
    branches: [main]
    paths:
      - "orca-harness/**"
      - ".github/workflows/harness-bench.yml"
  pull_request:
    branches: [main]
    paths:
      - "orca-harness/**"
      - ".github/workflows/harness-bench.yml"
  workflow_dispatch:

concurrency:
  group: harness-bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: benchmarks (orca-harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orca-harness
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orca-harness/target
          key: harness-bench-${{ runner.os }}-${{ hashFiles('orca-harness/Cargo.lock') }}

      # Pinned rather than apt-installed: startup.sh runs hyperfine with
      # --shell=none (1.13+), and a version that drifts under us would move
      # the numbers this job is supposed to be comparing.
      - name: install hyperfine
        run: |
          curl -fsSLO https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_amd64.deb
          sudo dpkg -i hyperfine_${HYPERFINE_VERSION}_amd64.deb
          rm hyperfine_${HYPERFINE_VERSION}_amd64.deb
          hyperfine --version
        env:
          HYPERFINE_VERSION: "1.20.0"

      - name: reporting tests
        run: |
          python3 benchmarks/check_budgets_test.py
          python3 benchmarks/kernel_report_test.py

      - name: build
        run: |
          cargo build --release -p orcacode
          cargo build --release -p orca-harness-core --example fanout_probe

      # Real-tool and criterion runs are left out: they measure the
      # runner's filesystem and process spawn more than the harness.
      - name: kernel benchmarks
        run: ./benchmarks/kernel.sh --ci

      - name: startup benchmarks
        run: ./benchmarks/startup.sh --ci

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: orca-harness/benchmarks/results/
          if-no-files-found: warn
